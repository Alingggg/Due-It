services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://server:3000
    volumes:
      - ./client:/app
      - /app/node_modules

  server:
    build: ./server
    command: ["bun", "--watch", "src/index.ts"]
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    env_file: ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
