services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    env_file:
      - path: ./client/.env
        required: false
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client:/app
      # keep the container's linux node_modules instead of the host's
      - /app/node_modules

  # server: added once its stack is chosen
